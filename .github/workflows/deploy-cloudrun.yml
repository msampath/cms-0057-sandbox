# Builds the Docker image and deploys it to Google Cloud Run. Runs on every
# push to main once the repository is configured; it is skipped silently
# until then. At demo traffic the service fits inside the Cloud Run
# always-free tier (min-instances 0, billed only while serving requests).
#
# One-time setup:
#   1. Create a Google Cloud project and attach billing (required even for
#      free-tier usage; set a small budget alert in Billing → Budgets).
#   2. Enable APIs:
#        gcloud services enable run.googleapis.com artifactregistry.googleapis.com
#   3. Create an Artifact Registry Docker repository:
#        gcloud artifacts repositories create containers \
#          --repository-format=docker --location=us-central1
#   4. Create a deploy service account and key:
#        gcloud iam service-accounts create github-deploy
#        gcloud projects add-iam-policy-binding <PROJECT_ID> \
#          --member serviceAccount:github-deploy@<PROJECT_ID>.iam.gserviceaccount.com \
#          --role roles/run.admin
#        (repeat for roles/artifactregistry.writer and roles/iam.serviceAccountUser)
#        gcloud iam service-accounts keys create key.json \
#          --iam-account github-deploy@<PROJECT_ID>.iam.gserviceaccount.com
#      Paste key.json into the repository secret GCP_SA_KEY, then delete it.
#   5. Repository variables (Settings → Secrets and variables → Actions):
#        GCP_PROJECT_ID    — the project id
#        GCP_REGION        — e.g. us-central1
#        GCP_AR_REPO       — e.g. containers
#        CLOUD_RUN_SERVICE — e.g. cms-0057-demo
#
# The deployed service answers at <run-url>/cms-0057 (the app is built with
# that basePath). The public URL surakshith.com/cms-0057 arrives later via a
# Firebase Hosting rewrite in front of this service; the domain root
# intentionally 404s until then.
#
# max-instances is pinned to 1: the demo keeps its transaction log and
# pending-review map in process memory, and a single instance keeps that
# state coherent. Scale-to-zero resets it, which the first-touch auto-seed
# is designed for.

name: Deploy to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.CLOUD_RUN_SERVICE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/cms-0057-demo:${{ github.sha }}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" .

      - name: Push image
        run: docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --image "$IMAGE" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --allow-unauthenticated \
            --port 3000 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1

      - name: Show service URL
        run: |
          gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --format 'value(status.url)'

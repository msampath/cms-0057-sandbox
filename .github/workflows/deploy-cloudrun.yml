# Builds the Docker image and deploys it to Google Cloud Run on every push
# to main. At demo traffic the service fits inside the Cloud Run always-free
# tier (min-instances 0, billed only while serving requests).
#
# Authentication is keyless via Workload Identity Federation: the project's
# org policy disables service-account key creation, and WIF is the better
# practice anyway. The OIDC provider on the Google side is restricted to
# this repository (attribute condition on assertion.repository), so these
# hardcoded identifiers are safe in a public repo — workflows from any other
# repo cannot mint tokens against them.
#
# GCP-side setup (already provisioned):
#   project           halogen-perception-rk8sk (number 420776046740)
#   service account   github-deploy@halogen-perception-rk8sk.iam.gserviceaccount.com
#                     roles: run.admin, artifactregistry.writer, iam.serviceAccountUser
#   WIF pool/provider github / github-oidc, condition:
#                     assertion.repository == 'msampath/cms-0057-sandbox'
#                     NOTE: renaming this GitHub repo breaks auth until this
#                     condition is updated to match. The GCP-side names below
#                     (service, image) are independent of the repo name and
#                     stay as cms-0057-demo, because changing the Cloud Run
#                     service name would change the run.app URL that the
#                     Firebase Hosting rewrite points at.
#   registry          us-central1-docker.pkg.dev/halogen-perception-rk8sk/containers
#
# The deployed service answers at <run-url>/cms-0057 (the app is built with
# that basePath; the domain root intentionally 404s). The public URL
# surakshith.com/cms-0057 arrives via a Firebase Hosting rewrite in front of
# this service.
#
# max-instances is pinned to 1: the demo keeps its transaction log and
# pending-review map in process memory, and a single instance keeps that
# state coherent. Scale-to-zero resets it, which the first-touch auto-seed
# is designed for.

name: Deploy to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

env:
  PROJECT_ID: halogen-perception-rk8sk
  REGION: us-central1
  SERVICE: cms-0057-demo
  IMAGE_BASE: us-central1-docker.pkg.dev/halogen-perception-rk8sk/containers/cms-0057-demo

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (keyless, WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/420776046740/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deploy@halogen-perception-rk8sk.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: docker build -t "${{ env.IMAGE_BASE }}:${{ github.sha }}" .

      - name: Push image
        run: docker push "${{ env.IMAGE_BASE }}:${{ github.sha }}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE }}" \
            --image "${{ env.IMAGE_BASE }}:${{ github.sha }}" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --allow-unauthenticated \
            --port 3000 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1

      - name: Show service URL
        run: |
          gcloud run services describe "${{ env.SERVICE }}" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --format 'value(status.url)'
